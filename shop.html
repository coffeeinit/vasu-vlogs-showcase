<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop · Vasu Vlogs</title>
<meta name="description" content="The Vasu Vlogs shop is coming soon. Follow @vasu_vlogs_ for launch news.">
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#FF6F00;--ink:#0F0D0C;--ink2:#1B1511;--sky:#2F74B5;--leaf:#1F7A4D;--paper:#fff;--gray:#F4F1EE;--line:#E6E0DA;--mute:#5E5249;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--paper);color:var(--ink);font:500 17px/1.6 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}a{color:inherit}
:focus-visible{outline:3px solid var(--o);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.d{font-family:"Bricolage Grotesque",Manrope,sans-serif;font-weight:800;letter-spacing:-.035em;line-height:.95}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 28px;border-radius:999px;font:700 16px Manrope,sans-serif;text-decoration:none;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn.o{background:var(--o);border-color:var(--o);color:var(--ink)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
/* nav */
nav{position:fixed;z-index:20;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(980px,calc(100% - 28px));display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 8px 8px 14px;border-radius:999px;background:rgba(15,13,12,.66);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.16);color:#fff}
nav .b{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 19px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
nav .b img{width:36px;height:36px;border-radius:50%;background:#fff;padding:2px;object-fit:contain}
nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0}
nav li a{text-decoration:none;font-weight:600;font-size:15px;opacity:.9}nav li a:hover{opacity:1;color:var(--o)}
nav .btn{padding:10px 20px;font-size:15px}
/* hero */
.hero{background:var(--ink);color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;min-height:100svh;padding-top:120px;padding-bottom:60px}
.live{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.22);font-size:15px;font-weight:600;margin-bottom:26px}
.live i{width:9px;height:9px;border-radius:50%;background:#3DDC84}
.hero h1{margin:0 0 44px;font-size:clamp(92px,17vw,250px)}
.hero h1 span{color:var(--o);display:block}
.hero p{font-size:20px;max-width:27em;color:#DCD2C9;margin:0 0 32px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn.ghost{color:#fff}
.vis{position:relative;width:100%;max-width:540px;margin-left:auto;aspect-ratio:1}
.disc{position:absolute;left:6%;top:6%;width:84%;aspect-ratio:1}
.disc::before{content:"";position:absolute;inset:-18px;border-radius:50%;border:4px solid var(--o)}
.disc img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:50%}
.vis .badge{position:absolute;right:0;bottom:2%;width:26%;aspect-ratio:1;border-radius:50%;background:#fff;padding:7px;object-fit:contain;border:5px solid var(--ink)}
.gl{position:absolute;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3);font-weight:700;font-size:15px}
.g1{right:-2%;top:22%}.g3{left:-2%;bottom:24%}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--t,0s)}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
/* marquee */
.mq{background:#E85F00;color:#fff;overflow:hidden;white-space:nowrap}
.mq div{display:inline-block;padding:18px 0;animation:mv 60s linear infinite}
.mq span{font:800 40px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;color:#fff;vertical-align:middle}
.mq svg{width:38px;height:38px;vertical-align:middle;margin:0 26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes mv{to{transform:translateX(-50%)}}
section{padding:110px 0}
h2{font-size:clamp(42px,7vw,100px);margin:0 0 18px}
.lead{color:var(--mute);font-size:19px;max-width:34em;margin:0 0 36px}
.stats{background:var(--ink);color:#fff;padding:38px 0}
.stats .wrap{display:flex;flex-wrap:wrap;gap:20px 64px;justify-content:center}
.stats b{display:block;font:800 46px "Bricolage Grotesque",sans-serif;color:var(--o)}
/* work */
.gal{display:block}
.galhead{max-width:640px;margin-bottom:28px}.galhead .lead{font-size:17px;margin:12px 0 0}
.spot{position:relative;height:min(560px,68vh);border-radius:32px;overflow:hidden;background:var(--ink);margin-bottom:22px;cursor:zoom-in;border:0;padding:0;display:block;width:100%}
.spot[hidden]{display:none}
.spot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .35s}
.spot img.out{opacity:0}
.spot .cap{position:absolute;left:18px;bottom:18px;z-index:2;background:rgba(255,255,255,.92);color:var(--ink);font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px}
.spot .bar{position:absolute;left:0;right:0;bottom:0;height:4px;z-index:2;background:rgba(255,255,255,.2)}
.spot .bar i{display:block;height:100%;width:0;background:var(--o)}
.spot .bar i.run{width:100%;transition:width 2s linear}
.rail{position:sticky;top:110px}
.rail h2{font-size:clamp(44px,5.4vw,78px)}
.rail .lead{font-size:17px;margin-bottom:26px}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:14px 20px;border-radius:18px;font:700 16px Manrope,sans-serif;cursor:pointer;text-align:left}
.chip b{font-size:14px;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:var(--o)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:8px;grid-auto-flow:dense;gap:0 18px}
.tile{display:block;position:relative;border:0;padding:0;border-radius:28px;overflow:hidden;cursor:zoom-in;background:var(--gray);margin-bottom:16px}
.tile.w{grid-column:span 2}
.tile img,.tile .demo{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.tile:hover img{transform:scale(1.05)}
.tile::after{content:"";position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(transparent,rgba(15,13,12,.7));pointer-events:none}
.tile span{position:absolute;left:16px;bottom:16px;z-index:1;background:rgba(255,255,255,.92);color:var(--ink);font-weight:700;font-size:13px;padding:5px 14px;border-radius:999px}
.tile em{position:absolute;z-index:1;left:18px;right:18px;bottom:56px;color:#fff;font-style:normal;font-weight:600;font-size:15px;text-align:left;opacity:0;transform:translateY(8px);transition:.35s}
.tile:hover em,.tile:focus-visible em{opacity:1;transform:none}
.demo{display:grid;place-items:center;color:#fff;font:800 28px "Bricolage Grotesque",sans-serif}
.more{display:flex;margin:14px auto 0}
.empty{color:var(--mute)}
/* what i do */
.what{background:var(--gray)}
.roles{display:flex;gap:14px;height:min(620px,78vh);margin-top:34px}
.pn{position:relative;flex:1;min-width:0;border-radius:32px;overflow:hidden;background:var(--ac);cursor:pointer;color:#fff;transition:flex .65s cubic-bezier(.2,.8,.2,1)}
.pn.on{flex:4.4}
.pn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.pn:nth-child(1) img{object-position:28% 70%}
.pn .sh{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,13,12,.88),rgba(15,13,12,.12) 62%)}
.pn::before{content:"";position:absolute;z-index:2;top:22px;left:22px;width:16px;height:16px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 5px rgba(255,255,255,.9)}
.pn .vt{position:absolute;z-index:2;left:50%;bottom:28px;writing-mode:vertical-rl;transform:translateX(-50%) rotate(180deg);font:800 34px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;transition:opacity .3s;white-space:nowrap}
.pn.on .vt{opacity:0}
.pn .in{position:absolute;z-index:2;left:0;bottom:0;width:min(470px,100%);padding:34px;opacity:0;transform:translateY(22px);transition:opacity .35s,transform .5s}
.pn.on .in{opacity:1;transform:none;transition-delay:.25s}
.pn h3{margin:0 0 10px;font-size:clamp(40px,5vw,72px)}
.pn p{margin:0 0 18px;font-size:18px;color:#F1E9E2}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tags em{font-style:normal;font-weight:700;font-size:13px;padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3)}
.pn .go{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:12px 24px;font:700 15px Manrope,sans-serif;cursor:pointer}
.pn .go:hover{background:var(--o)}
/* about */
.about{display:grid;grid-template-columns:.85fr 1.15fr;gap:64px;align-items:center}
.about .ph{border-radius:36px;overflow:hidden;aspect-ratio:4/5;background:var(--gray)}
.about .ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.about h2{font-size:clamp(40px,6vw,84px)}
.about p{color:var(--mute);font-size:19px;max-width:32em}
.about strong{color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding:0;list-style:none}
.facts li{background:var(--gray);border-radius:999px;padding:9px 18px;font-weight:700;font-size:15px}
.brands{display:flex;flex-wrap:wrap;gap:12px;padding:0;margin:0;list-style:none}
.brands li{border:1.5px solid var(--line);border-radius:999px;padding:12px 26px;font-weight:700;font-size:18px}
/* services */
.svc{background:var(--ink);color:#fff}
.svc .lead{color:#CFC5BC}
.rows{border-bottom:1px solid rgba(255,255,255,.16)}
.rows a{display:grid;grid-template-columns:1.3fr 1.2fr 58px;gap:24px;align-items:center;padding:28px 12px;text-decoration:none;border-top:1px solid rgba(255,255,255,.16);transition:background .25s}
.rows a:hover{background:var(--ink2)}
.rows b{font:800 clamp(26px,3.8vw,46px)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.rows span{color:#CFC5BC;font-size:17px}
.rows i{width:54px;height:54px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);display:grid;place-items:center;font-style:normal;font-size:22px;transition:.25s}
.rows a:hover i{background:var(--o);border-color:var(--o);color:var(--ink);transform:rotate(-45deg)}
/* contact */
.cbox{background:var(--o);color:var(--ink);border-radius:44px;padding:clamp(34px,6vw,84px);text-align:center}
.cbox h2{font-size:clamp(40px,7vw,104px);margin:0 auto 20px;max-width:12em}
.cbox p{max-width:30em;margin:0 auto 30px;font-size:19px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cbox .btn.ghost{color:var(--ink)}
footer{background:var(--ink);color:#fff;padding:36px 0 calc(36px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
footer img{width:58px;height:58px;border-radius:50%;background:#fff;padding:3px;object-fit:contain}
footer p{margin:0;color:#CFC5BC;font-size:15px}
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;width:100%;height:100%}
dialog::backdrop{background:rgba(10,8,7,.94)}
.lb{display:grid;place-items:center;height:100%;padding:60px 64px 48px;position:relative}
.lb img{max-height:100%;max-width:100%;object-fit:contain;border-radius:14px}
.lb button{position:absolute;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.3);width:48px;height:48px;border-radius:50%;font-size:24px;cursor:pointer}
.lb button:hover{background:var(--o);color:var(--ink)}
.lb .x{top:14px;right:14px}.lb .pv{left:12px;top:50%}.lb .nx{right:12px;top:50%}
@media (max-width:900px){
nav ul{display:none}
.hero .wrap{grid-template-columns:1fr;min-height:0;padding-top:104px}
.vis{margin:20px auto 0;max-width:440px}
.about{grid-template-columns:1fr}
.roles{flex-direction:column;height:auto}.pn,.pn.on{flex:none;height:380px}.pn .vt{display:none}.pn .in{opacity:1;transform:none;padding:26px}
.about{gap:34px}.about .ph{max-width:420px}
.rows a{grid-template-columns:1fr 54px;gap:6px 16px}.rows span{grid-column:1}.rows i{grid-row:1/3;grid-column:2}
section{padding:72px 0}.mq span{font-size:30px}.mq svg{width:28px;height:28px;margin:0 16px}
.lb{padding:60px 8px 48px}}
@media (max-width:900px){.gal{grid-template-columns:1fr;gap:26px}.rail{position:static}.rail h2{font-size:clamp(44px,12vw,72px)}.chips{flex-direction:row;flex-wrap:wrap}.chip{padding:10px 18px;border-radius:999px;gap:10px}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.tile.w{grid-column:auto}}
@media (prefers-reduced-motion:reduce){.rise{animation:none}.mq div{animation:none}html{scroll-behavior:auto}.tile img,.btn,.pn,.pn .in{transition:none}}

/* icons, social, support, footer, inner pages */
.sico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sico.f{fill:currentColor;stroke:none}
.btn.ic{padding:13px 22px}
a.live{text-decoration:none;color:inherit;transition:border-color .2s}a.live:hover{border-color:var(--o)}
.stats a{color:inherit;text-decoration:none}.stats a:hover b{color:#fff}
.facts li a{text-decoration:none}.facts li a:hover{color:var(--o)}
.about p a{color:var(--ink);font-weight:700}
.soc{display:flex;gap:10px}
.soc a{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;color:#fff;transition:.2s}
.soc a:hover{background:var(--o);border-color:var(--o);color:var(--ink);transform:translateY(-2px)}
.supp{background:var(--gray)}
.supp .wrap{display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap}
.supp .lead{margin:12px 0 0;color:var(--mute);font-size:19px;max-width:28em}
.fb{display:flex;align-items:center;gap:16px}
.fl{display:flex;gap:10px 24px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.fl a{color:#CFC5BC;text-decoration:none;font-weight:600;font-size:15px}.fl a:hover{color:var(--o)}
.pg{background:var(--ink);color:#fff;padding:150px 0 70px}
.pg h1{font-size:clamp(68px,13vw,190px);margin:14px 0 20px}
.pg h1 span{color:var(--o)}
.pg p{font-size:20px;color:#DCD2C9;max-width:30em;margin:0}
.pgb{padding:70px 0 100px}
.g2{display:grid;grid-template-columns:1.35fr .8fr;gap:28px;align-items:start}
.card{border:1.5px solid var(--line);border-radius:32px;padding:clamp(22px,4vw,40px);background:#fff}
.card.dk{background:var(--ink);color:#fff;border-color:var(--ink)}
.card h2{font-size:clamp(30px,4vw,48px);margin:0 0 16px}
.card p{margin:0 0 18px;color:var(--mute)}.card.dk p{color:#CFC5BC}
.card .stack{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.lbl{display:block;font-weight:700;font-size:14px;margin:0 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.pill{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 18px;font:700 15px Manrope,sans-serif;cursor:pointer}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fld{display:block;margin-bottom:18px}
.fld span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.fld input,.fld textarea{width:100%;font:500 17px Manrope,sans-serif;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;background:#fff;color:var(--ink)}
.fld textarea{min-height:130px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.note{color:var(--mute);font-size:14px;margin:14px 0 0}
.ok{color:var(--leaf);font-weight:700;font-size:15px;margin:14px 0 0;min-height:1.5em}
.upi{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;padding:14px 18px;border-radius:18px;background:var(--gray);font-weight:700}
.upi code{font:700 16px Manrope,sans-serif;word-break:break-all}
.ways{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.ways li{display:flex;gap:14px;align-items:flex-start}
.ways b{display:block}.ways span{color:var(--mute);font-size:15px}
.ways i{width:38px;height:38px;border-radius:50%;background:var(--o);color:var(--ink);display:grid;place-items:center;flex:none;font-style:normal;font-weight:800}
@media (max-width:900px){.g2{grid-template-columns:1fr}.two{grid-template-columns:1fr}.pg{padding:120px 0 50px}.pgb{padding:44px 0 70px}.fb{width:100%}}
.fld[hidden]{display:none}
.card h2{line-height:1.05}
.pg h1{line-height:1}
.pg h1+p{margin-top:8px}
#payBox .acts{margin-bottom:6px}
#payBox+.note{margin-top:22px}
.supp .wrap>div{flex:1 1 380px;max-width:640px}.supp{padding:80px 0}

/* v3: nav hide, 100K chip, splash, shop */
nav{transition:transform .38s cubic-bezier(.2,.8,.2,1)}
nav.hide{transform:translate(-50%,-170%)}
.g4{left:-2%;top:9%}
.gl.k{background:var(--o);color:var(--ink);border-color:var(--o);display:inline-flex;align-items:center;gap:8px;-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.w{background:#fff;border-color:#fff;color:var(--ink)}
.btn.w .sico{fill:var(--o);stroke:var(--o)}
.what .facts li{background:#fff}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 36%,#2E1A0B 0,var(--ink) 64%);color:#fff;padding:24px;overflow:hidden;cursor:pointer;transition:opacity .55s,visibility .55s}
#splash[hidden]{display:none}
#splash.out{opacity:0;visibility:hidden}
#splash .in{position:relative;z-index:2;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.86) translateY(20px)}to{opacity:1;transform:none}}
#splash .k{font:800 clamp(120px,28vw,340px)/.9 "Bricolage Grotesque",sans-serif;letter-spacing:-.05em;color:var(--o);margin:6px 0 4px}
#splash h2{font-size:clamp(28px,4.6vw,54px);margin:10px 0 10px;line-height:1.04}
#splash p{color:#DCD2C9;font-size:19px;margin:0 auto 26px;max-width:26em}
#splash .h{display:inline-flex;align-items:center;gap:10px;font-weight:700;padding:8px 18px;border:1px solid rgba(255,255,255,.28);border-radius:999px}
#splash .btn{font-size:16px}
.cf{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;opacity:0;animation:fall linear infinite;z-index:1}
@keyframes fall{0%{transform:translateY(-6vh) rotate(0);opacity:1}100%{transform:translateY(112vh) rotate(720deg);opacity:1}}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:28px}
.sp{position:relative;aspect-ratio:4/5;border-radius:28px;background:linear-gradient(135deg,var(--gray),#E9E0D7);overflow:hidden;display:flex;align-items:flex-end;padding:18px}
.sp::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:sh 2.8s ease-in-out infinite}
@keyframes sh{to{transform:translateX(100%)}}
.sp span{position:relative;background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px}
